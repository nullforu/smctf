name: Manual Docker Build and Push (Repository ZIP)

on:
  workflow_dispatch:
    inputs:
      ecr_repository:
        description: "ECR repository name"
        required: false
        default: backend
        type: string
      image_tag:
        description: "Docker image tag"
        required: true
        default: latest
        type: string
      architecture:
        description: "Build architecture mode"
        required: true
        type: choice
        options:
          - amd64
          - multi
      dockerfile_path:
        description: "Dockerfile path"
        required: true
        default: ./Dockerfile
        type: string
      build_context:
        description: "Docker build context directory"
        required: true
        default: .
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-northeast-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker build paths
        run: |
          DOCKERFILE_PATH="${GITHUB_WORKSPACE}/${{ github.event.inputs.dockerfile_path }}"
          BUILD_CONTEXT="${GITHUB_WORKSPACE}/${{ github.event.inputs.build_context }}"

          DOCKERFILE_PATH="$(realpath "$DOCKERFILE_PATH")"
          BUILD_CONTEXT="$(realpath "$BUILD_CONTEXT")"

          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "Dockerfile not found: $DOCKERFILE_PATH"
            exit 1
          fi

          if [ ! -d "$BUILD_CONTEXT" ]; then
            echo "Build context directory not found: $BUILD_CONTEXT"
            exit 1
          fi

          echo "DOCKERFILE_PATH=$DOCKERFILE_PATH" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> "$GITHUB_ENV"

          echo "Dockerfile path: $DOCKERFILE_PATH"
          echo "Build context: $BUILD_CONTEXT"
          echo "Build context files:"
          find "$BUILD_CONTEXT" -maxdepth 2 -type f | sort

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ github.event.inputs.ecr_repository }}:${{ github.event.inputs.image_tag }}
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Build and push (amd64 only)
        if: ${{ github.event.inputs.architecture == 'amd64' }}
        run: |
          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE_URI" \
            "$BUILD_CONTEXT"

          docker push "$IMAGE_URI"

      - name: Set up QEMU
        if: ${{ github.event.inputs.architecture == 'multi' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: ${{ github.event.inputs.architecture == 'multi' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push (multi-arch)
        if: ${{ github.event.inputs.architecture == 'multi' }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE_URI" \
            --push \
            "$BUILD_CONTEXT"
