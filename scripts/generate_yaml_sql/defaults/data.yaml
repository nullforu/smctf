divisions:
  - "고등부"
  - "대학부"

teams:
  - name: "GALF"
    division: "고등부"
    users:
      enabled: true
      count: 4
      name_pattern: "{team_name}_{number}"
      emails:
        - "alpha1@example.com"
        - "alpha2@example.com"
        - "alpha3@example.com"
        - "alpha4@example.com"
  - name: "BETA"
    division: "대학부"
    users:
      enabled: false

challenges:
  - title: "Bookwish"
    description: |
      원하는 책을 신청할 수 있는 서비스입니다.

      서비스의 취약점을 찾고 익스플로잇하여 플래그를 획득하세요.

      플래그 형식은 `DH{...}` 입니다.

      > Level 2, 출처: https://dreamhack.io/wargame/challenges/2267
    points: 100
    flag: "DH{Bookwish}"
    category: "Web"
    vm_enabled: true
    vm_spec:
      - container_port: 8000
        protocol: TCP
    vm_spec_path: "./web-bookwish.yaml"
    file_name: "bookwish-user.zip"
    file_key: "9f6c1c2a-5b2f-4d0f-9e4f-0f2f7eaa12ab.zip"
    file_uploaded_at: "2026-02-13 12:00:00"
  - title: "Simple Note Manager"
    description: |
      노트를 관리하는 간단한 웹 서비스입니다.

      취약점을 찾고 익스플로잇하여 플래그를 획득하세요!

      플래그 형식은 `DH{...}` 입니다.

      > Level 1, 출처: https://dreamhack.io/wargame/challenges/1751
